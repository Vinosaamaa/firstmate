<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Firstmate documentation review</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.8.1/github-markdown-light.min.css">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f8fa; color: #1f2328; }
    .review-header { position: sticky; top: 0; z-index: 2; display: flex; gap: 18px; align-items: center; padding: 12px 24px; background: rgba(255,255,255,.96); border-bottom: 1px solid #d0d7de; font: 14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .review-header strong { color: #0969da; }
    .review-header a { color: #1f2328; text-decoration: none; }
    main { width: min(1180px, calc(100% - 32px)); margin: 24px auto 64px; display: grid; gap: 24px; }
    .surface { min-width: 0; padding: 38px 46px; background: #fff; border: 1px solid #d0d7de; border-radius: 10px; box-shadow: 0 2px 8px rgba(31,35,40,.06); overflow: hidden; }
    .surface-label { margin: -10px 0 24px; color: #57606a; font: 600 12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .08em; text-transform: uppercase; }
    .markdown-body { min-width: 0; }
    .markdown-body table { display: table; width: 100%; table-layout: fixed; font-size: 13px; }
    .markdown-body th, .markdown-body td { min-width: 0; overflow-wrap: anywhere; vertical-align: top; }
    .loading { color: #57606a; font: 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    @media (max-width: 760px) { .surface { padding: 24px 18px; } .markdown-body table { display: block; width: 100%; table-layout: auto; } }
  </style>
</head>
<body>
  <nav class="review-header">
    <strong>Firstmate fork sync</strong>
    <a href="#readme">README surface</a>
    <a href="#comparison">Orchestrator comparison</a>
  </nav>
  <main>
    <section class="surface" id="readme">
      <div class="surface-label">Rendered public README</div>
      <article class="markdown-body loading" data-source="README.md">Rendering README...</article>
    </section>
    <section class="surface" id="comparison">
      <div class="surface-label">Rendered maintainer verification</div>
      <article class="markdown-body loading" data-source="coding-agent-orchestrators.md">Rendering comparison...</article>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@16.2.1/lib/marked.umd.js"></script>
  <script>
    Promise.all([...document.querySelectorAll('[data-source]')].map(async (node) => {
      const response = await fetch(node.dataset.source);
      if (!response.ok) throw new Error(`Could not load ${node.dataset.source}: ${response.status}`);
      node.innerHTML = marked.parse(await response.text(), { gfm: true });
      node.classList.remove('loading');
    })).then(() => { document.documentElement.dataset.rendered = 'true'; });
  </script>
</body>
</html>
