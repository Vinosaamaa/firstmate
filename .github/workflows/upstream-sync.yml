name: Weekly upstream sync

on:
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: automated-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into stable sync branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Merge new upstream history and update one PR
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_URL: https://github.com/kunchenguid/firstmate.git
          SYNC_BRANCH: automated/upstream-sync
        run: |
          set -eu

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
          fi
          git fetch upstream main

          upstream_commit=$(git rev-parse upstream/main)
          if git merge-base --is-ancestor upstream/main origin/main; then
            {
              echo '### Upstream sync: no update needed'
              echo
              echo "Fork main already contains upstream commit \`$upstream_commit\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$SYNC_BRANCH" \
            && git merge-base --is-ancestor upstream/main "origin/$SYNC_BRANCH"; then
            {
              echo '### Upstream sync: no new upstream commit'
              echo
              echo "The stable sync branch already contains upstream commit \`$upstream_commit\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if git show-ref --verify --quiet "refs/remotes/origin/$SYNC_BRANCH"; then
            git checkout -b "$SYNC_BRANCH" "origin/$SYNC_BRANCH"
          else
            git checkout -b "$SYNC_BRANCH" origin/main
          fi

          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            {
              echo '### Upstream sync blocked by a fork-main conflict'
              echo
              echo "No branch update or PR mutation was published. Resolve only through a requested Firstmate sync."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! git merge --no-edit --no-ff upstream/main; then
            git merge --abort || true
            {
              echo '### Upstream sync blocked by an upstream conflict'
              echo
              echo "No branch update or PR mutation was published. Resolve only through a requested Firstmate sync."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git push origin "HEAD:refs/heads/$SYNC_BRANCH"
          pushed_sha=$(git rev-parse HEAD)

          pr_body="$RUNNER_TEMP/upstream-sync-pr.md"
          printf '%s\n' \
            '## Summary' \
            '' \
            "- Merge current \`kunchenguid/firstmate:main\` at \`$upstream_commit\` into this fork with ordinary Git history preserved." \
            '- Generated by a deterministic GitHub Actions workflow with no AI or LLM use.' \
            '- This PR is never auto-merged; conflicts stop before branch publication.' \
            > "$pr_body"

          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$SYNC_BRANCH" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Sync current upstream main' \
              --body-file "$pr_body"
            pr_url=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          else
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title 'Sync current upstream main' \
              --body-file "$pr_body")
            pr_number=$(gh pr view "$pr_url" \
              --repo "$GITHUB_REPOSITORY" \
              --json number \
              --jq .number)
          fi

          prior_runs="$RUNNER_TEMP/ci-runs-before-dispatch"
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ci.yml \
            --event workflow_dispatch \
            --branch "$SYNC_BRANCH" \
            --limit 100 \
            --json databaseId \
            --jq '.[].databaseId' > "$prior_runs"
          gh workflow run ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$SYNC_BRANCH"

          ci_run=''
          attempt=0
          while [ "$attempt" -lt 60 ]; do
            ci_run=$(
              gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow ci.yml \
                --event workflow_dispatch \
                --branch "$SYNC_BRANCH" \
                --limit 20 \
                --json databaseId,headSha,url \
                --jq '.[] | [.databaseId, .headSha, .url] | @tsv' \
                | while IFS=$'\t' read -r run_id head_sha run_url; do
                    [ "$head_sha" = "$pushed_sha" ] || continue
                    grep -Fxq "$run_id" "$prior_runs" && continue
                    printf '%s\t%s\n' "$run_id" "$run_url"
                    break
                  done
            )
            [ -z "$ci_run" ] || break
            sleep 5
            attempt=$((attempt + 1))
          done
          [ -n "$ci_run" ] || {
            echo '### Upstream sync could not resolve its required CI run' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          ci_run_id=${ci_run%%$'\t'*}
          ci_run_url=${ci_run#*$'\t'}
          printf '%s\n' \
            '' \
            '## Required CI' \
            '' \
            "- Full 15-test required run: $ci_run_url" \
            >> "$pr_body"
          gh pr edit "$pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$pr_body"

          {
            echo '### Upstream sync PR updated'
            echo
            echo "- Upstream commit: \`$upstream_commit\`"
            echo "- Pull request: $pr_url"
            echo "- Required CI: $ci_run_url"
            echo '- Merge remains a captain/Firstmate decision.'
          } >> "$GITHUB_STEP_SUMMARY"

          if ! gh run watch "$ci_run_id" \
            --repo "$GITHUB_REPOSITORY" \
            --exit-status; then
            {
              echo
              echo '### Required CI failed'
              echo
              echo "The exact workflow_dispatch run for \`$pushed_sha\` failed: $ci_run_url"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo
            echo '### Required CI passed'
            echo
            echo "The exact workflow_dispatch run for \`$pushed_sha\` passed."
          } >> "$GITHUB_STEP_SUMMARY"
